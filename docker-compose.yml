# Orvella with Docker
#   docker compose up -d --build                     # app + PostgreSQL → http://localhost:8000
#   docker compose --profile tunnel up -d --build    # + temporary public URL (https://….trycloudflare.com)
# Secrets come from ./.env (created by scripts/tunnel.ps1 or scripts/tunnel.sh, see .env.example).
# Sandbox images for the runner are built once with ./scripts/build-sandbox.sh.

name: orvella

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orvella
      POSTGRES_DB: orvella
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orvella -d orvella"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: orvella-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ORVELLA_DATABASE_URL: postgresql+psycopg://orvella:${POSTGRES_PASSWORD}@db:5432/orvella
      ORVELLA_SECRET_KEY: ${SECRET_KEY:?isi SECRET_KEY di file .env}
      ORVELLA_DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      # cookies only over HTTPS (the tunnel) — browsers still accept them on http://localhost
      ORVELLA_COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ORVELLA_RUNNER_URL: http://runner:8080
      ORVELLA_RUNNER_TOKEN: ${RUNNER_TOKEN:?isi RUNNER_TOKEN di file .env}
      ORVELLA_PREVIEW_SECRET: ${PREVIEW_SECRET:?isi PREVIEW_SECRET di file .env}
      ORVELLA_PREVIEW_PORT: ${PREVIEW_PORT:-8301}
      ORVELLA_PREVIEW_PUBLIC_URL: ${PREVIEW_PUBLIC_URL:-}
      ORVELLA_PREVIEW_METRICS: http://tunnel-preview:2000
    ports:
      - "${APP_PORT:-8000}:8000"

  # Runs learner code in throwaway sandbox containers (orvella-sbx-*). The only service with the docker
  # socket; it has no published port and only ever touches containers labelled orvella.sandbox=1.
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    image: orvella-runner:latest
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?isi RUNNER_TOKEN di file .env}
      MAX_RUN_CONCURRENCY: ${MAX_RUN_CONCURRENCY:-2}
      MAX_WS_SESSIONS: ${MAX_WS_SESSIONS:-3}
      JOBS_VOLUME: orvella_jobs
      GOCACHE_VOLUME: orvella_gocache
      WORKSPACES_VOLUME: orvella_workspaces
      COMPOSE_PROJECT: orvella
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi MYSQL_ROOT_PASSWORD di file .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jobs:/jobs
      - workspaces:/workspaces
    depends_on:
      mysql:
        condition: service_healthy

  # Serves running web projects on their own origin (port 8301) so learner code never shares Orvella's origin.
  # The runner attaches it to each project's private network (label orvella.attach=preview).
  preview:
    build: ./preview
    image: orvella-preview:latest
    restart: unless-stopped
    labels:
      orvella.attach: preview
    environment:
      PREVIEW_SECRET: ${PREVIEW_SECRET:?isi PREVIEW_SECRET di file .env}
    ports:
      - "${PREVIEW_PORT:-8301}:8301"

  # MariaDB for PHP + MySQL projects: one database and one user per project. Tuned small (~100 MB).
  mysql:
    image: mariadb:11
    restart: unless-stopped
    labels:
      orvella.attach: mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi MYSQL_ROOT_PASSWORD di file .env}
    command: ["--innodb-buffer-pool-size=32M", "--innodb-log-buffer-size=4M", "--key-buffer-size=4M", "--max-connections=60",
              "--performance-schema=OFF", "--table-open-cache=256", "--thread-cache-size=4", "--skip-name-resolve",
              "--max-statement-time=10"]
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Cloudflare quick tunnel: no account needed, a new random URL on every start.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: tunnel --no-autoupdate --protocol ${TUNNEL_PROTOCOL:-auto} --url http://app:8000

  # Second quick tunnel for the preview origin; the app reads its hostname from the metrics endpoint.
  tunnel-preview:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      preview:
        condition: service_healthy
    command: tunnel --no-autoupdate --protocol ${TUNNEL_PROTOCOL:-auto} --metrics 0.0.0.0:2000 --url http://preview:8301

volumes:
  pgdata:
  jobs:
    name: orvella_jobs
  gocache:
    name: orvella_gocache
  workspaces:
    name: orvella_workspaces
  mysqldata:
