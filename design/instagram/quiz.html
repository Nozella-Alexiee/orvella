<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Orvella · carousel "Tebak output-nya?"</title>
<!-- 5 slide 1080 × 1440 berjajar (5400 px). ?q=py|js|cpp (lihat quizzes.js). render.mjs memotong per slide. -->
<link rel="stylesheet" href="vendor/orvi.css">
<link rel="stylesheet" href="sticker.css">
<style>
  body { width: 5400px; height: 1440px; overflow: hidden; }
  #q { position: relative; width: 5400px; height: 1440px; }
  .sl { position: absolute; top: 0; width: 1080px; height: 1440px; }
  .a { position: absolute; }
  .top { position: absolute; left: 80px; top: 70px; display: flex; align-items: center; gap: 18px; font: 800 34px var(--font-ui); }
  .top .mono { width: 76px; height: 76px; border-radius: 22px; font-size: 28px; }
  .count { position: absolute; right: 80px; bottom: 60px; font: 700 30px var(--font-mono); color: var(--ink-3); }
  .brand { position: absolute; left: 80px; bottom: 50px; display: flex; align-items: center; gap: 12px; font: 800 36px var(--font-display); font-stretch: 85%; }
  .lbl { font: 800 44px/1 var(--font-ui); padding: 20px 36px; }
  .no { display: inline-grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; background: var(--grape-soft); color: var(--ink); font: 800 46px var(--font-display); flex: none; }
  .opt { font: 700 64px/1 var(--font-mono); padding: 18px 40px 18px 18px; gap: 26px; }
  .opt.is-right { --c: var(--mint); --fg: #fff; }
  .opt.is-right .no { background: #fff; }
  .say { font: 700 40px/1.35 var(--font-ui); padding: 30px 38px; border-radius: 40px 40px 40px 12px; max-width: 640px; }
  .memrow { display: flex; align-items: center; gap: 34px; }
  .box { display: grid; justify-items: center; gap: 6px; padding: 24px 34px 22px; min-width: 190px; }
  .box > span { font: 800 30px var(--font-mono); color: var(--ink-2); }
  .box b { font: 800 84px/1 var(--font-mono); }
  .box small { font: 700 26px var(--font-ui); color: var(--ink-3); }
  .arrow { width: 110px; height: 70px; }
  .arrow path { fill: none; stroke: var(--ink); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="q" class="paper"></div>
<script src="vendor/lucide.min.js"></script>
<script src="vendor/orvi.js"></script>
<script src="stickers.js"></script>
<script src="quizzes.js"></script>
<script>
(async () => {
  const S = window.STK, qs = new URLSearchParams(location.search);
  if (qs.get('list')) { await S.ready(); return; }
  const id = qs.get('q') || 'py', Q = window.QUIZZES[id], ids = Object.keys(window.QUIZZES);
  const next = window.QUIZZES[ids[ids.indexOf(id) + 1]];
  const root = document.getElementById('q');
  const KW = /\b(let|const|int|print|console|log|cout|def|return|for|in)\b/g;
  const hl = line => line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/("[^"]*")/g, '<span class="s">$1</span>').replace(/\b(\d+)\b(?![^<]*>)/g, '<span class="num">$1</span>')
    .replace(KW, m => `<span class="k">${m}</span>`);
  const letter = i => 'ABC'[i];
  const slide = (i, html) => root.insertAdjacentHTML('beforeend', `<section class="sl" style="left:${i * 1080}px">
      <div class="top"><span class="stk mono sm" style="--c:${Q.color};${Q.ink ? `color:${Q.ink}` : ''}">${Q.mono}</span>Tebak output #${Q.no} · ${Q.lang}</div>
      ${html}
      <div class="brand">${S.logo(56)}orvella</div><div class="count">${i + 1}/5</div></section>`);
  const put = (x, y, html, style = '') => `<div class="a" style="left:${x}px;top:${y}px;${style}">${html}</div>`;
  const codeCard = (fs, extra = '') => `<div class="stk code" style="--t:14px;font-size:${fs}px;line-height:1.6;border-radius:38px;padding:40px 52px;${extra}">
      ${Q.code.map((l, n) => `<div class="ln"><span class="n">${n + 1}</span><span>${hl(l)}</span></div>`).join('')}</div>`;
  const opts = (mark) => Q.options.map((o, i) => `<span class="stk pill opt${mark && i === Q.answer ? ' is-right' : ''}" style="${mark && i === Q.answer ? '' : '--c:#fff;'}${mark && i !== Q.answer ? 'opacity:.45;' : ''}"><span class="no">${letter(i)}</span>${o.replace(/</g, '&lt;')}</span>`);

  // 1 · hook
  slide(0, `
    ${put(80, 250, `<div class="big die" style="font-size:250px">Tebak</div>`, 'transform:rotate(-3deg)')}
    ${put(80, 500, `<div class="big die" style="font-size:250px"><span class="hl" style="background:var(--grape);color:#fff">output</span></div>`, 'transform:rotate(1deg)')}
    ${put(80, 760, `<div class="big die" style="font-size:250px">-nya?</div>`, 'transform:rotate(-2deg)')}
    ${put(560, 930, S.orvi('think', 470, { pipT: 2.3 }), 'transform:rotate(6deg)')}
    ${put(110, 1110, `<span class="stk pill lbl" style="--c:var(--coral);--fg:#fff">Geser dulu <svg data-i="arrow-right" width="46" height="46" stroke-width="3"></svg></span>`, 'transform:rotate(-3deg)')}
    ${S.spark(900, 280, 90, '#FFB224', 10)}${S.spark(820, 600, 60, '#FF7EB6')}${S.spark(120, 1020, 56, '#1FB488')}${S.tape(760, 150, 8, '#C9A5FF')}`);

  // 2 · kode + pilihan
  slide(1, `
    ${put(80, 190, `<div class="big die" style="font-size:120px;text-transform:none;letter-spacing:-.02em">Apa yang dicetak?</div>`, 'transform:rotate(-1.5deg)')}
    ${put(90, 400, codeCard(64), 'transform:rotate(-1.5deg)')}
    ${opts(false).map((h, i) => put(130 + i * 40, 810 + i * 150, h, `transform:rotate(${[-2, 2, -1][i]}deg)`)).join('')}
    ${put(760, 1000, S.orvi('focus', 250, { pipT: .6 }), 'transform:rotate(-6deg)')}
    ${S.spark(930, 380, 70, '#FFB224', 12)}${S.tape(820, 350, -12, '#9BE7B4', 170)}`);

  // 3 · jawab dulu
  slide(2, `
    ${put(80, 210, `<div class="big die" style="font-size:210px">Jawab di</div>`, 'transform:rotate(-2deg)')}
    ${put(80, 430, `<div class="big die" style="font-size:210px"><span class="hl" style="background:var(--coral);color:#fff">komentar</span></div>`, 'transform:rotate(1.5deg)')}
    ${put(80, 650, `<div class="big die" style="font-size:210px">dulu!</div>`, 'transform:rotate(-2deg)')}
    ${put(140, 930, `<span class="stk" style="--c:#fff;padding:34px 44px;gap:24px;font:800 64px/1 var(--font-display);font-stretch:85%;border-radius:44px 44px 44px 12px"><svg data-i="message-circle" width="78" height="78" stroke-width="2.6" style="color:var(--grape)"></svg>A, B, atau C?</span>`, 'transform:rotate(-3deg)')}
    ${S.doodle('M 40 20 C 140 60, 170 150, 110 230 M 110 230 L 60 200 M 110 230 L 140 175', 760, 700, 220, 260)}
    ${put(700, 1000, S.orvi('think', 300, { pipT: 1.1 }), 'transform:rotate(5deg)')}
    ${put(150, 1170, `<p style="font:700 36px var(--font-ui);color:var(--ink-2)">Jawabannya di slide berikut →</p>`)}
    ${S.spark(920, 250, 80, '#FF7EB6', -8)}${S.spark(110, 860, 50, '#FFB224')}`);

  // 4 · jawaban
  const boxes = list => list.map(([n, v, note]) => `<span class="stk box" style="--c:var(--blue-soft)"><span>${n}</span><b>${v}</b>${note ? `<small>${note}</small>` : ''}</span>`).join('');
  slide(3, `
    ${put(80, 200, `<div class="big die" style="font-size:120px">Jawabannya</div>`, 'transform:rotate(-2deg)')}
    ${put(90, 380, `<span class="stk pill opt is-right" style="--t:14px;font-size:104px;padding:22px 64px 22px 22px;gap:34px"><span class="no" style="width:124px;height:124px;font-size:68px">${letter(Q.answer)}</span>${Q.options[Q.answer].replace(/</g, '&lt;')}</span>`, 'transform:rotate(-3deg)')}
    ${put(100, 640, `<div class="memrow">${boxes(Q.mem.before)}<svg class="arrow" viewBox="0 0 110 70"><path d="M 8 35 L 100 35 M 70 8 L 100 35 L 70 62"/></svg>${boxes(Q.mem.after)}</div>`)}
    ${put(80, 960, S.orvi('happy', 300, { pipT: .8 }), 'transform:rotate(-5deg)')}
    ${put(380, 990, `<span class="stk say" style="--c:#fff">${Q.explain}</span>`, 'transform:rotate(1.5deg)')}
    ${S.spark(880, 220, 90, '#1FB488', 8)}${S.spark(620, 420, 60, '#FFB224')}${S.tape(700, 170, -6, '#FFD27A')}`);

  // 5 · penutup
  slide(4, `
    ${put(80, 200, `<div class="big die" style="font-size:170px;letter-spacing:0">Gak perlu</div>`, 'transform:rotate(-2deg)')}
    ${put(80, 380, `<div class="big die" style="font-size:190px;letter-spacing:0"><span class="hl">nebak</span></div>`, 'transform:rotate(1deg)')}
    ${put(80, 575, `<div class="big die" style="font-size:170px;letter-spacing:0">lagi.</div>`, 'transform:rotate(-2deg)')}
    ${put(90, 760, `<p style="font:700 40px/1.35 var(--font-ui);color:var(--ink-2);width:540px">Di Orvella, isi memorinya kelihatan gerak.</p>`)}
    ${put(630, 600, S.orvi('cheer', 400, { pipT: .9 }), 'transform:rotate(8deg)')}
    ${put(90, 930, `<span class="stk" style="--c:#fff;padding:24px 40px;font:800 90px/1 var(--font-display);font-stretch:82%;letter-spacing:-.03em">@orvella.labs</span>`, 'transform:rotate(-3deg)')}
    ${put(110, 1115, `<span class="stk pill lbl" style="--c:var(--lilac);--fg:#fff">Follow &amp; nyalakan notifikasi</span>`, 'transform:rotate(2deg)')}
    ${put(130, 1245, `<p style="font:700 34px var(--font-ui);color:var(--ink-2)">${next ? `Seri berikutnya: tebak output ${next.lang}.` : 'Mau bahasa apa berikutnya? Tulis di komentar.'}</p>`)}
    ${S.spark(900, 180, 80, '#FFB224', 14)}${S.spark(560, 640, 56, '#8D5CF6')}${S.tape(620, 120, 10, '#FFB5AC')}`);

  S.icons();
  await S.ready();
})();
</script>
</body>
</html>
