<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Orvella · gambar Open Graph (Stiker pop)</title>
<!-- 1200 × 630, dipakai frontend/public/og.png untuk pratinjau tautan (WhatsApp, X, Discord, dll). -->
<link rel="stylesheet" href="vendor/orvi.css">
<link rel="stylesheet" href="sticker.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; }
  #og { position: relative; width: 1200px; height: 630px; }
  .a { position: absolute; }
  .brand { display: flex; align-items: center; gap: 12px; font: 800 46px var(--font-display); font-stretch: 85%; letter-spacing: -.02em; }
  .h { font-size: 104px; letter-spacing: 0; }
  .sub { font: 700 30px/1.35 var(--font-ui); color: var(--ink-2); }
  .row { display: flex; gap: 16px; }
</style>
</head>
<body>
<div id="og" class="paper"></div>
<script src="vendor/lucide.min.js"></script>
<script src="vendor/orvi.js"></script>
<script src="stickers.js"></script>
<script>
(async () => {
  const S = window.STK, og = document.getElementById('og');
  const put = (x, y, html, style = '') => og.insertAdjacentHTML('beforeend', `<div class="a" style="left:${x}px;top:${y}px;${style}">${html}</div>`);
  put(60, 44, `<div class="brand">${S.logo(70)}orvella</div>`);
  put(62, 150, `<div class="big die h">Learn.</div>`, 'transform:rotate(-2deg)');
  put(62, 255, `<div class="big die h">Build.</div>`, 'transform:rotate(1deg)');
  put(62, 365, `<div class="big die h"><span class="hl">Collaborate.</span></div>`, 'transform:rotate(-2deg)');
  put(66, 518, `<p class="sub">Jalanin kodenya, lihat memorinya gerak.</p>`);
  put(820, 70, S.orvi('happy', 330, { pipT: -.5 }), 'transform:rotate(6deg)');
  put(800, 440, `<div class="row">${[0, 1, 5, 6].map((i, n) => S.mono(i, 84, [-6, 4, -3, 7][n])).join('')}</div>`);
  og.insertAdjacentHTML('beforeend', S.spark(1110, 60, 56, '#FFB224', 10) + S.spark(760, 380, 40, '#FF7EB6') + S.spark(1130, 390, 36, '#1FB488') + S.tape(640, 36, -8, '#C9A5FF', 150));
  S.icons();
  await S.ready();
})();
</script>
</body>
</html>
