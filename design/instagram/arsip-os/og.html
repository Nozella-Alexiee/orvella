<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Orvella · gambar Open Graph</title>
<!-- 1200 × 630 → frontend/public/og.png (pratinjau link di WhatsApp, X, Discord, dll). -->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="vendor/orvi.css">
<style>
  :root {
    --orvi-hi: #FFF3C9; --orvi-mid: #FFC53D; --orvi-lo: #F28C00; --orvi-face: #2A1F4E; --orvi-cheek: #FF7E62;
    --orvi-tint: #8C74FF; --orvi-glow-op: .62; --pip: #EEE9FF; --pip-shade: #C8BDF4; --lilac: #8C74FF;
    --sh-rgb: 0 0 0; --win-solid: #1A173A; --line-2: rgb(255 255 255 / .17); --ink-3: #A6A0D6; --sun: #FFC247;
  }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Figtree Variable", sans-serif; color: #F3F1FF;
    background: radial-gradient(520px 420px at 26% 50%, #3A2C8F, transparent 70%), radial-gradient(420px 360px at 88% 90%, rgb(255 95 168 / .28), transparent 70%),
      linear-gradient(120deg, #0B0A22, #221757); }
  .stars i { position: absolute; border-radius: 50%; background: #fff; }
  .wrap { position: relative; display: grid; grid-template-columns: 470px 1fr; align-items: center; height: 100%; padding: 0 70px 0 30px; }
  .orvi-box { width: 470px; height: 470px; }
  .word { display: flex; align-items: center; gap: 18px; font: 800 44px "Unbounded Variable", sans-serif; letter-spacing: -.03em; }
  .word svg { width: 58px; height: 58px; color: #F8F1E4; }
  h1 { margin-top: 26px; font: 800 70px/1.02 "Unbounded Variable", sans-serif; letter-spacing: -.035em; }
  h1 em { font-style: normal; color: #FFC247; }
  p { margin-top: 24px; font: 500 27px/1.45 "Figtree Variable", sans-serif; color: #CFC8F2; }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="wrap">
  <div class="orvi-box" data-orvi="happy" data-pip=".55"></div>
  <div>
    <div class="word"><svg class="mark" viewBox="-62 -62 124 124"></svg>Orvella</div>
    <h1>Pahami dulu, <br>baru <em>ngoding.</em></h1>
    <p>Belajar ngoding lewat 4 fase: Pahami, Perkuat, Kuis, Uji. Python, C++, Rust, web, dan bahasa lainnya.</p>
  </div>
</div>
<script src="vendor/lucide.min.js"></script>
<script src="vendor/orvi.js"></script>
<script src="common.js"></script>
<script>
(async () => {
  const rnd = seeded(11), st = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('i'), r = rnd() * 2.6 + 1;
    Object.assign(s.style, { left: rnd() * 1200 + 'px', top: rnd() * 630 + 'px', width: r + 'px', height: r + 'px', opacity: .2 + rnd() * .5 });
    st.appendChild(s);
  }
  paintCommon();
  await ready();
})();
</script>
</body>
</html>
